<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Database Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

html,
body {
    min-height: 100%;
    background: #0B0E14;
    color: #F8FAFC;
}

body {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

.container {
    display: flex;
    height: 100vh;
    gap: 18px;
    padding: 18px;
    background: #0B0E14;
}

.sidebar {
    width: 300px;
    min-width: 280px;
    background: #161B26;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    overflow: visible;
    position: relative;
    box-shadow: 0 18px 60px rgba(15, 23, 42, 0.35);
}

.sidebar::-webkit-scrollbar,
.history-list::-webkit-scrollbar,
.chat-area::-webkit-scrollbar {
    width: 10px;
}

.sidebar::-webkit-scrollbar-track,
.history-list::-webkit-scrollbar-track,
.chat-area::-webkit-scrollbar-track {
    background: transparent;
}

.sidebar::-webkit-scrollbar-thumb,
.history-list::-webkit-scrollbar-thumb,
.chat-area::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.22);
    border-radius: 999px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 26px;
}

.new-chat {
    width: 100%;
    background: #6366F1;
    border: none;
    color: #F8FAFC;
    padding: 14px 18px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.01em;
    box-shadow: 0 14px 32px rgba(99, 102, 241, 0.24);
    transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
}

.new-chat:hover {
    transform: translateY(-1px);
    background: #4F46E5;
}

.new-chat:active {
    transform: scale(0.98);
}

.section-title {
    margin-top: 34px;
    margin-bottom: 22px;
    color: #64748B;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
}

.history-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    background: transparent;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    position: relative;
    border: none;
}

.history-item:hover {
    background: #1F2637;
    transform: translateY(-1px);
}

.history-item.active {
    background: #1E2533;
    border: none;
}

.history-title {
    flex: 1;
    font-size: 14px;
    color: #94A3B8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover .history-title,
.history-item.active .history-title {
    color: #FFFFFF;
}

.history-menu-btn {
    background: transparent;
    border: none;
    color: #94A3B8;
    cursor: pointer;
    padding: 6px 8px;
    margin-left: 10px;
    font-size: 16px;
    border-radius: 10px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.history-menu-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #FFFFFF;
    transform: translateY(-1px);
}

.history-menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    background: #111827;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    min-width: 145px;
    z-index: 9999;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
    padding: 8px 0;
}

.history-menu.show {
    display: block;
}

.history-menu-item {
    padding: 12px 16px;
    cursor: pointer;
    color: #F8FAFC;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-size: 13px;
    transition: background 0.2s ease;
}

.history-menu-item:hover {
    background: rgba(255, 255, 255, 0.05);
}

.history-menu-item.delete {
    color: #F87171;
}

.agent-card {
    margin-top: auto;
    background: #161B26;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.07);
}

.agent-card.active {
    background: rgba(99, 102, 241, 0.1);
    border-left: 3px solid #6366F1;
    border-color: rgba(99, 102, 241, 0.2);
}

.agent-name {
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #F8FAFC;
}

.agent-model {
    font-size: 13px;
    color: #94A3B8;
    margin-top: 6px;
}

.agent-card.active .agent-model {
    color: #E0F2FE;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0B0E14;
}

.header {
    min-height: 72px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
}

.title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
}

.chat-area {
    flex: 1;
    overflow: hidden;
    padding: 30px;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
    background: #0B0E14;
}

.chat-area-inner {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-right: 4px;
}

.chat-area-inner::-webkit-scrollbar {
    width: 12px;
}

.chat-area-inner::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.20);
    border-radius: 999px;
}

.welcome,
.messages-container {
    width: 100%;
}

.welcome {
    text-align: center;
    margin: auto;
    max-width: 650px;
    padding: 46px 24px;
    border-radius: 24px;
    background: #161B26;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.35);
}

.ai-orb {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    margin: 0 auto;
    background: radial-gradient(circle at top, rgba(99, 102, 241, 0.92), rgba(59, 130, 246, 0.65) 55%, rgba(15, 23, 42, 0.9));
    box-shadow: 0 24px 70px rgba(99, 102, 241, 0.24);
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

.welcome h1 {
    margin-top: 26px;
    font-size: clamp(2rem, 4vw, 3rem);
    line-height: 1.02;
}

.welcome p {
    color: #94A3B8;
    margin-top: 14px;
    font-size: 1rem;
    line-height: 1.75;
}

.messages-container {
    display: none;
    flex-direction: column;
    gap: 18px;
    padding-bottom: 18px;
}

.messages-container.show {
    display: flex;
}

.message {
    display: flex;
    gap: 12px;
    animation: slideIn 0.25s ease-out;
    margin-bottom: 8px;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.message-content {
    max-width: 74%;
    padding: 12px 14px;
    border-radius: 16px 16px 16px 4px;
    word-wrap: break-word;
    white-space: pre-wrap;
    font-size: 0.98rem;
    line-height: 1.6;
    border: 1px solid transparent;
    box-shadow: none;
    background: rgba(255, 255, 255, 0.02);
    color: #E2E8F0;
}

.message.user .message-content {
    background: #6366F1;
    color: #F8FAFC;
    border-radius: 16px 16px 4px 16px;
    border: none;
    box-shadow: 0 12px 24px rgba(99, 102, 241, 0.2);
}

.message.assistant .message-content {
    background: rgba(255, 255, 255, 0.02);
    color: #E2E8F0;
    border: 1px solid rgba(255, 255, 255, 0.04);
}

.message-content pre,
.message-content code {
    font-family: 'Fira Code', 'Source Code Pro', monospace;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 12px 14px;
    border-radius: 14px;
    overflow-x: auto;
    color: #E2E8F0;
}

.message-content pre {
    margin: 0.75rem 0 0;
}

.message-content code {
    padding: 2px 6px;
}

.json-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.json-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.json-card-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: #F8FAFC;
}

.json-card-subtitle {
    font-size: 0.78rem;
    color: #94A3B8;
}

.json-order-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.json-order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.json-order-item:first-child {
    padding-top: 0;
    border-top: none;
}

.json-order-left {
    min-width: 0;
}

.json-order-id {
    font-size: 0.92rem;
    font-weight: 600;
    color: #F8FAFC;
}

.json-order-meta {
    font-size: 0.78rem;
    color: #94A3B8;
    margin-top: 2px;
}

.json-order-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.json-order-total {
    font-size: 0.92rem;
    font-weight: 600;
    color: #F8FAFC;
}

.json-status-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.json-status-delivered {
    background: rgba(34, 197, 94, 0.16);
    color: #22C55E;
}

.json-status-pending {
    background: rgba(234, 179, 8, 0.16);
    color: #EAB308;
}

.chat-input {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 16px 26px 18px;
    background: rgba(7, 10, 15, 0.92);
}

.input-box {
    display: flex;
    background: #070A0F;
    border-radius: 16px;
    padding: 8px 10px;
    gap: 10px;
    min-height: 50px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-box:focus-within {
    border: 1px solid #6366F1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.input-box input {
    flex: 1;
    border: none;
    background: transparent;
    color: #F8FAFC;
    outline: none;
    padding: 8px 10px;
    font-size: 15px;
}

.input-box input::placeholder {
    color: #94A3B8;
}

.send-btn {
    background: #6366F1;
    border: none;
    color: #F8FAFC;
    min-width: 46px;
    height: 34px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 14px 30px rgba(99, 102, 241, 0.24);
}

.send-btn:hover {
    background: #4F46E5;
    transform: translateY(-1px);
}

.send-btn:active {
    transform: scale(0.98);
}

.send-btn:disabled {
    background: #374151;
    cursor: not-allowed;
    box-shadow: none;
}

.loading {
    color: #94A3B8;
    font-size: 13px;
    margin-top: 10px;
    letter-spacing: 0.01em;
}

@media (max-width: 1100px) {
    .container {
        flex-direction: column;
        padding: 14px;
    }

    .sidebar {
        width: 100%;
        min-width: auto;
        max-height: 420px;
    }

    .main {
        min-height: 0;
    }

    .chat-area {
        padding: 22px;
    }
}

@media (max-width: 720px) {
    .header {
        padding: 0 18px;
    }

    .chat-area {
        padding: 18px;
    }

    .chat-input {
        padding: 18px;
    }

    .input-box {
        flex-direction: column;
    }

    .send-btn {
        width: 100%;
    }

    .message-content {
        max-width: 100%;
    }
}
</style>
</head>

<body>
{% csrf_token %}
<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            AI Assistant
        </div>

        <button class="new-chat" id="newChatBtn">
            + New Chat
        </button>

        <div class="section-title">
            History
        </div>

        <div class="history-list" id="historyList">
        </div>

        <div class="section-title">
            Active Agent
        </div>

        <div class="agent-card active" id="activeAgent">
            <div class="agent-name" id="agentName">
                Loading...
            </div>

            <div class="agent-model" id="agentModel">
                Claude Sonnet 4.5
            </div>
        </div>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="header">
            <div class="title" id="headerTitle">
                Welcome
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-area-inner" id="chatAreaInner">
                <div class="welcome" id="welcomeSection">
                    <div class="ai-orb"></div>
                    <h1>Welcome Back</h1>
                    <p>
                        Manage orders, customers and products
                        using natural language.
                    </p>
                </div>

                <div class="messages-container" id="messagesContainer">
                </div>
            </div>
        </div>

        <div class="chat-input">

            <div class="input-box">

                <input
                    type="text"
                    placeholder="Ask about orders..."
                    id="messageInput"
                    autocomplete="off"
                >

                <button class="send-btn" id="sendBtn">
                    ➜
                </button>

            </div>

            <div class="loading" id="loadingText" style="display:none;">
                Processing...
            </div>

        </div>

</div>

<script>

// ─── Global State ──────────────────────────────────
let currentAgent = null;
let currentConversation = null;
let messageSet = new Set();

// ─── DOM Elements ──────────────────────────────────
const newChatBtn = document.getElementById("newChatBtn");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatArea = document.getElementById("messagesContainer");
const welcomeSection = document.getElementById("welcomeSection");
const chatAreaInner = document.getElementById("chatAreaInner");
const historyList = document.getElementById("historyList");
const activeAgentDiv = document.getElementById("activeAgent");
const headerTitle = document.getElementById("headerTitle");
const agentName = document.getElementById("agentName");
const agentModel = document.getElementById("agentModel");
const loadingText = document.getElementById("loadingText");

// ─── Initialize ──────────────────────────────────
function init() {
    loadAgent();
    loadConversationHistory();
    setupEventListeners();
}

// ─── Load Current Agent ──────────────────────────────────
function loadAgent() {
    const pathParts = window.location.pathname.split("/");
    const agentSlug = pathParts[2];
    
    if (!agentSlug) return;
    
    currentAgent = agentSlug;
    
    // Extract agent info from context (passed by Django template)
    if (window.agentData) {
        agentName.textContent = window.agentData.display_name;
        agentModel.textContent = window.agentData.model;
        headerTitle.textContent = window.agentData.display_name;
    }
    
    loadConversationHistory();
}

// ─── Load Conversation History ──────────────────────────────────
function loadConversationHistory() {
    if (!currentAgent) return;
    
    fetch(`/agent/${currentAgent}/history/`)
        .then(res => res.json())
        .then(data => {
            historyList.innerHTML = "";
            messageSet.clear();
            
            data.conversations.forEach(conv => {
                messageSet.add(conv.id);
                addHistoryItem(conv);
            });
        })
        .catch(err => console.error("Error loading history:", err));
}

// ─── Add History Item ──────────────────────────────────
function addHistoryItem(conversation) {
    const item = document.createElement("div");
    item.className = "history-item";
    item.id = `conv-${conversation.id}`;

    if (currentConversation && currentConversation.id === conversation.id) {
        item.classList.add("active");
    }

    const title = document.createElement("div");
    title.className = "history-title";
    title.title = conversation.title;
    title.textContent = conversation.title;

    const menuBtn = document.createElement("button");
    menuBtn.type = "button";
    menuBtn.className = "history-menu-btn";
    menuBtn.textContent = "⋯";
    menuBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleMenu(conversation.id);
    });

    const menu = document.createElement("div");
    menu.className = "history-menu";
    menu.id = `menu-${conversation.id}`;

    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "history-menu-item";
    openBtn.textContent = "Open";
    openBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        closeAllMenus();
        loadConversation(conversation.id);
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "history-menu-item delete";
    deleteBtn.textContent = "Delete";
    deleteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        closeAllMenus();
        deleteConversation(conversation.id);
    });

    menu.addEventListener("click", (event) => {
        event.stopPropagation();
    });

    menu.appendChild(openBtn);
    menu.appendChild(deleteBtn);
    item.appendChild(title);
    item.appendChild(menuBtn);
    item.appendChild(menu);

    item.addEventListener("click", (event) => {
        if (event.target.closest(".history-menu-btn") || event.target.closest(".history-menu")) {
            return;
        }
        loadConversation(conversation.id);
    });

    historyList.appendChild(item);
}

function closeAllMenus() {
    document.querySelectorAll(".history-menu.show").forEach(menu => {
        menu.classList.remove("show");
    });
}

// ─── Toggle Menu ──────────────────────────────────
function toggleMenu(conversationId) {
    const menu = document.getElementById(`menu-${conversationId}`);
    if (!menu) return;

    const isOpen = menu.classList.contains("show");
    closeAllMenus();
    if (!isOpen) {
        menu.classList.add("show");
    }
}

// ─── Load Conversation ──────────────────────────────────
function loadConversation(conversationId) {
    if (!currentAgent) return;
    
    window.location.href = `/chat/${currentAgent}/${conversationId}/`;
}

// ─── Delete Conversation ──────────────────────────────────
function deleteConversation(conversationId) {
    if (!confirm("Delete this conversation?")) return;
    if (!currentAgent) return;
    
    fetch(`/chat/${currentAgent}/delete/${conversationId}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": getCookie("csrftoken"),
        }
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success && data.status !== 'deleted') {
            throw new Error(data.error || 'Delete failed');
        }

        const item = document.getElementById(`conv-${conversationId}`);
        if (item) item.remove();
        messageSet.delete(conversationId);
        
        if (currentConversation && currentConversation.id === conversationId) {
            window.location.href = `/chat/${currentAgent}/`;
            return;
        }

        loadConversationHistory();
    })
    .catch(err => console.error("Error deleting conversation:", err));
}

// ─── New Chat ──────────────────────────────────
function newChat() {
    if (!currentAgent) return;
    
    fetch(`/chat/${currentAgent}/new/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": getCookie("csrftoken"),
        }
    })
    .then(() => {
        window.location.href = `/chat/${currentAgent}/`;
    })
    .catch(err => console.error("Error creating new chat:", err));
}

// ─── Send Message ──────────────────────────────────
function sendMessage() {
    const message = messageInput.value.trim();
    if (!message || !currentAgent) return;
    
    messageInput.value = "";
    sendBtn.disabled = true;
    loadingText.style.display = "block";
    
    // Show user message
    displayMessage(message, "user");
    
    const payload = {
        message: message,
    };

    if (currentConversation && currentConversation.id) {
        payload.conversation_id = currentConversation.id;
    }

    const csrfToken = getCsrfToken();
    const url = `/chat/${currentAgent}/send/`;

    fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
        },
        body: JSON.stringify(payload)
    })
    .then(async res => {
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch (err) {
            throw new Error(`Invalid JSON response (${res.status}): ${text}`);
        }
    })
    .then(data => {
        if (data.error) {
            displayMessage("Error: " + data.error, "assistant");
        } else {
            if (!currentConversation) {
                currentConversation = {
                    id: data.conversation_id,
                    title: data.conversation_title || "",
                };
            } else {
                currentConversation.id = data.conversation_id;
                if (data.conversation_title) {
                    currentConversation.title = data.conversation_title;
                }
            }
            displayMessage(data.reply, "assistant");
            loadConversationHistory();
        }
    })
    .catch(err => {
        displayMessage("Error: " + err.message, "assistant");
    })
    .finally(() => {
        sendBtn.disabled = false;
        loadingText.style.display = "none";
        messageInput.focus();
    });
}

// ─── Display Message ──────────────────────────────────
function displayMessage(text, role) {
    welcomeSection.style.display = "none";
    chatArea.classList.add("show");
    
    const msgEl = document.createElement("div");
    msgEl.className = `message ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "message-content";

    const structured = renderStructuredContent(text);
    if (structured) {
        bubble.appendChild(structured);
    } else {
        bubble.textContent = text;
    }

    msgEl.appendChild(bubble);
    chatArea.appendChild(msgEl);
    scrollChatToBottom();
}

function renderStructuredContent(text) {
    if (typeof text !== "string") return null;

    const trimmed = text.trim();
    if (!trimmed || !/^[\[{]/.test(trimmed)) return null;

    try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) {
            return buildOrderCard(parsed);
        }

        if (parsed && typeof parsed === "object") {
            const candidate = parsed.orders || parsed.orders_list || parsed.items || parsed.results || parsed.data;
            if (Array.isArray(candidate)) {
                return buildOrderCard(candidate);
            }
        }
    } catch (err) {
        return null;
    }

    return null;
}

function buildOrderCard(orders) {
    const card = document.createElement("div");
    card.className = "json-card";

    const header = document.createElement("div");
    header.className = "json-card-header";

    const title = document.createElement("div");
    title.className = "json-card-title";
    title.textContent = "Order Summary";

    const subtitle = document.createElement("div");
    subtitle.className = "json-card-subtitle";
    subtitle.textContent = `${orders.length} order${orders.length === 1 ? "" : "s"}`;

    header.appendChild(title);
    header.appendChild(subtitle);
    card.appendChild(header);

    const list = document.createElement("div");
    list.className = "json-order-list";

    orders.forEach((order) => {
        if (!order || typeof order !== "object") return;

        const item = document.createElement("div");
        item.className = "json-order-item";

        const left = document.createElement("div");
        left.className = "json-order-left";

        const idValue = order.id || order.order_id || order.orderId || order.orderNumber || order.order_number || order.number || "Unknown";
        const orderId = document.createElement("div");
        orderId.className = "json-order-id";
        orderId.textContent = `Order ${idValue}`;

        const meta = document.createElement("div");
        meta.className = "json-order-meta";
        meta.textContent = order.customer || order.customer_name || order.customerName || order["customer__name"] || "Customer info unavailable";

        left.appendChild(orderId);
        left.appendChild(meta);

        const right = document.createElement("div");
        right.className = "json-order-right";

        const totalValue = order.total_amount || order.total || order.amount || order.totalAmount || order.amount_due || order.totalDue;
        const total = document.createElement("div");
        total.className = "json-order-total";
        total.textContent = totalValue !== undefined && totalValue !== null && totalValue !== ""
            ? `₹${Number(totalValue).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
            : "—";

        const rawStatus = (order.status || "pending").toString().toLowerCase();
        const badge = document.createElement("span");
        badge.className = `json-status-badge ${rawStatus.includes("deliver") ? "json-status-delivered" : "json-status-pending"}`;
        badge.textContent = rawStatus.includes("deliver") ? "Delivered" : "Pending";

        right.appendChild(total);
        right.appendChild(badge);
        item.appendChild(left);
        item.appendChild(right);
        list.appendChild(item);
    });

    card.appendChild(list);
    return card;
}

function scrollChatToBottom() {
    if (chatArea && chatArea.scrollHeight) {
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    if (chatAreaInner && chatAreaInner.scrollHeight) {
        chatAreaInner.scrollTop = chatAreaInner.scrollHeight;
    }
}

// ─── Get CSRF Token ──────────────────────────────────
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function getCsrfToken() {
    return getCookie('csrftoken') || document.querySelector('input[name="csrfmiddlewaretoken"]')?.value || '';
}

// ─── Setup Event Listeners ──────────────────────────────────
function setupEventListeners() {
    newChatBtn.addEventListener("click", newChat);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Close menu when clicking outside
    document.addEventListener("click", () => {
        document.querySelectorAll(".history-menu.show").forEach(menu => {
            menu.classList.remove("show");
        });
    });
}

// ─── Populate Messages (from Django context) ──────────────────────────────
function loadMessagesFromContext() {
    if (!window.messagesData) return;
    
    chatArea.innerHTML = "";
    welcomeSection.style.display = "none";
    chatArea.classList.add("show");
    
    window.messagesData.forEach(msg => {
        const role = msg.role === "user" ? "user" : "assistant";
        displayMessage(msg.content, role);
    });
    scrollChatToBottom();
}

// ─── Start App ──────────────────────────────────
document.addEventListener("DOMContentLoaded", init);

// Expose functions for inline event handlers
window.toggleMenu = toggleMenu;
window.loadConversation = loadConversation;
window.deleteConversation = deleteConversation;

</script>
